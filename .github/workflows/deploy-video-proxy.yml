name: Deploy video proxy

# The video proxy is a second Worker (workers/video-proxy/, worker
# plv-video-proxy on proxy.whatships.com) with its own wrangler.toml. The
# root `wrangler deploy` cannot reach it, so it deploys here. It used to be a
# step in the site workflow, which shared one failure domain and one
# concurrency group with the site: a proxy fix could sit behind a broken site
# build, and a site deploy that died before the proxy step shipped a bundle
# pointing at a proxy that was never updated. This workflow is scoped to the
# proxy's own files and serializes on its own group.
on:
  push:
    branches: [main]
    paths:
      - "workers/video-proxy/**"
      - ".github/workflows/deploy-video-proxy.yml"
  workflow_dispatch:

# Same reasoning as the site deploy: a run already inside `wrangler deploy`
# must not be killed by the next push. Disabled cancellation lets the
# in-flight deploy finish and collapses superseded queued runs.
concurrency:
  group: deploy-video-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The proxy has its own contract test; run it before deploying.
      - name: Test
        run: pnpm exec vitest run tests/video-proxy.test.ts

      - name: Deploy video proxy
        id: deploy
        run: |
          deploy_out=$(pnpm exec wrangler deploy 2>&1 | tee /dev/stderr)
          verify_base=$(printf '%s' "$deploy_out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1 || true)
          if [ -z "$verify_base" ]; then
            echo "::warning::no workers.dev URL in wrangler output; verify falls back to the custom domain, which the zone's bot mitigation may challenge"
            verify_base="https://proxy.whatships.com"
          fi
          echo "verify_base=$verify_base" >> "$GITHUB_OUTPUT"
        working-directory: workers/video-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # `wrangler deploy` returning 0 does not prove the Worker is reachable.
      # A request without ?url= exercises the deployed code and returns its
      # documented 400 — the liveness signal. It targets the workers.dev URL
      # for the same reason as the site verify: the whatships.com zone
      # answers GitHub-hosted runner IPs with a 403 "Just a moment..."
      # interstitial before the request reaches the Worker. The custom
      # domain is probed once afterwards, warning-tier only.
      - name: Verify video proxy
        env:
          VERIFY_BASE: ${{ steps.deploy.outputs.verify_base }}
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
          for attempt in $(seq 1 10); do
            resp=$(curl -sS --max-time 15 -A "$UA" -w '\n%{http_code}' "$VERIFY_BASE/?check=$(date +%s)" || true)
            status=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            if [ "$status" = "400" ] && printf '%s' "$body" | grep -qF 'Missing ?url='; then
              echo "Video proxy verified: $VERIFY_BASE answered with the expected 400"
              apex=$(curl -sS --max-time 15 -A "$UA" -w '\n%{http_code}' "https://proxy.whatships.com/?check=$(date +%s)" || true)
              apex_status=$(printf '%s' "$apex" | tail -n1)
              apex_body=$(printf '%s' "$apex" | sed '$d')
              if [ "$apex_status" = "400" ] && printf '%s' "$apex_body" | grep -qF 'Missing ?url='; then
                echo "Custom domain read-back: proxy.whatships.com answered too"
              else
                echo "::warning::Custom domain read-back inconclusive (HTTP ${apex_status:-<none>}); a runner-IP miss is expected while the zone challenges datacenter traffic."
              fi
              exit 0
            fi
            echo "attempt $attempt/10: $VERIFY_BASE status '${status:-<none>}'"
            snippet=$(printf '%s' "$body" | head -c 200 || true)
            echo "  body: $(printf '%s' "$snippet" | tr '\n' ' ')"
            sleep 6
          done
          echo "::error::Video proxy did not answer at $VERIFY_BASE after deploy"
          exit 1
