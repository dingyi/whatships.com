name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys serialize on one group, but a run that has already
# reached its Deploy step must never be killed by the next push: an
# interrupted `wrangler deploy` leaves production indistinguishable from a
# shipped deploy. With cancel-in-progress disabled an in-flight run always
# finishes and only runs still waiting in the queue are superseded, which is
# exactly the desired behaviour. The video proxy is a separate Worker with
# its own workflow (deploy-video-proxy.yml) and its own concurrency group, so
# a site failure can no longer hold back a proxy fix or vice versa.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is pinned here, not in package.json's `packageManager` field:
      # that field makes pnpm self-manage the manager version and rewrite
      # `packageManagerDependencies` in pnpm-lock.yaml on every local
      # `npx pnpm install` (the entry even flips between `pnpm` and
      # `@pnpm/exe` depending on the invocation), which keeps the lockfile
      # permanently dirty. Keep this in sync with the version in AGENTS.md.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run the repository's own checks before anything reaches the edge.
      # `pnpm build` succeeding is not a substitute for them: `astro check`
      # covers template/type diagnostics and vitest covers the catalog,
      # workers and page contract tests.
      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test:run

      # PUBLIC_VIDEO_PROXY_BASE is inlined into the client bundle at build
      # time; without it playback falls back to local /streams (dev only).
      - name: Build
        run: pnpm build
        env:
          PUBLIC_VIDEO_PROXY_BASE: https://proxy.whatships.com

      # Local playback streams are dev artifacts and blow past the Workers
      # 25 MiB per-asset cap. Production playback uses the video proxy.
      # /admin is local-only; strip if a future change ever emits it.
      - name: Strip local artifacts
        run: rm -rf dist/streams dist/admin

      - name: Deploy
        id: deploy
        run: |
          deploy_out=$(pnpm exec wrangler deploy 2>&1 | tee /dev/stderr)
          verify_base=$(printf '%s' "$deploy_out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1 || true)
          if [ -z "$verify_base" ]; then
            echo "::warning::no workers.dev URL in wrangler output; verify falls back to the apex, which the zone's bot mitigation may challenge"
            verify_base="https://whatships.com"
          fi
          echo "verify_base=$verify_base" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A green `wrangler deploy` only proves the upload request returned 0,
      # not that production is serving this commit. Read the build marker
      # back over HTTP and fail the run if it does not match; this is the
      # signal that turns a dropped change from invisible into a red run.
      #
      # The read-back targets the deployment's workers.dev URL: the apex is
      # inside the whatships.com zone, whose bot mitigation answers
      # GitHub-hosted runner IPs (datacenter ASN) with a 403 "Just a
      # moment..." interstitial before the request reaches the Worker — the
      # apex check 403'd on every attempt from the day it landed while every
      # deploy was actually live. workers.dev serves the same Worker +
      # assets outside the zone's rules. The apex is still probed once
      # afterwards, warning-tier only: a runner-IP miss there is expected
      # while the zone challenges datacenter traffic.
      - name: Verify deploy
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          VERIFY_BASE: ${{ steps.deploy.outputs.verify_base }}
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
          for attempt in $(seq 1 20); do
            resp=$(curl -sS --max-time 15 -A "$UA" -w '\n%{http_code}' \
              "$VERIFY_BASE/version.json?expected=$EXPECTED_COMMIT&attempt=$attempt" || true)
            status=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            served=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$served" = "$EXPECTED_COMMIT" ]; then
              echo "Deploy verified: $VERIFY_BASE is serving $served (HTTP $status)"
              apex=$(curl -sS --max-time 15 -A "$UA" -w '\n%{http_code}' \
                "https://whatships.com/version.json?expected=$EXPECTED_COMMIT" || true)
              apex_status=$(printf '%s' "$apex" | tail -n1)
              apex_body=$(printf '%s' "$apex" | sed '$d')
              apex_served=$(printf '%s' "$apex_body" | jq -r '.commit // empty' 2>/dev/null || true)
              if [ "$apex_served" = "$EXPECTED_COMMIT" ]; then
                echo "Apex read-back: whatships.com is serving $apex_served too"
              else
                echo "::warning::Apex read-back inconclusive (HTTP ${apex_status:-<none>}, commit '${apex_served:-<no marker>}'). workers.dev confirmed the deploy; an apex miss from a runner IP usually means the zone challenged the request."
              fi
              exit 0
            fi
            echo "attempt $attempt/20: $VERIFY_BASE HTTP ${status:-<none>}, commit '${served:-<no marker>}' (expected $EXPECTED_COMMIT)"
            snippet=$(printf '%s' "$body" | head -c 300 || true)
            echo "  body: $(printf '%s' "$snippet" | tr '\n' ' ')"
            sleep 10
          done
          echo "::error::Deployment never served commit $EXPECTED_COMMIT at $VERIFY_BASE"
          exit 1
