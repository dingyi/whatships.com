name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys serialize on one group, but a run that has already
# reached its Deploy step must never be killed by the next push: an
# interrupted `wrangler deploy` leaves production indistinguishable from a
# shipped deploy. With cancel-in-progress disabled an in-flight run always
# finishes and only runs still waiting in the queue are superseded, which is
# exactly the desired behaviour. The video proxy is a separate Worker with
# its own workflow (deploy-video-proxy.yml) and its own concurrency group, so
# a site failure can no longer hold back a proxy fix or vice versa.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is pinned here, not in package.json's `packageManager` field:
      # that field makes pnpm self-manage the manager version and rewrite
      # `packageManagerDependencies` in pnpm-lock.yaml on every local
      # `npx pnpm install` (the entry even flips between `pnpm` and
      # `@pnpm/exe` depending on the invocation), which keeps the lockfile
      # permanently dirty. Keep this in sync with the version in AGENTS.md.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run the repository's own checks before anything reaches the edge.
      # `pnpm build` succeeding is not a substitute for them: `astro check`
      # covers template/type diagnostics and vitest covers the catalog,
      # workers and page contract tests.
      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test:run

      # PUBLIC_VIDEO_PROXY_BASE is inlined into the client bundle at build
      # time; without it playback falls back to local /streams (dev only).
      - name: Build
        run: pnpm build
        env:
          PUBLIC_VIDEO_PROXY_BASE: https://proxy.whatships.com

      # Local playback streams are dev artifacts and blow past the Workers
      # 25 MiB per-asset cap. Production playback uses the video proxy.
      # /admin is local-only; strip if a future change ever emits it.
      - name: Strip local artifacts
        run: rm -rf dist/streams dist/admin

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A green `wrangler deploy` only proves the upload request returned 0,
      # not that production is serving this commit. Read the build marker back
      # from the live domain (the unique query string is a fresh cache key, so
      # the check sees the deployed version rather than an edge copy of the
      # previous one) and fail the run if it does not match. This is the signal
      # that turns a dropped change from invisible into a red run.
      - name: Verify deploy
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            body=$(curl -sS --max-time 15 "https://whatships.com/version.json?expected=$EXPECTED_COMMIT" || true)
            served=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$served" = "$EXPECTED_COMMIT" ]; then
              echo "Deploy verified: production is serving $served"
              exit 0
            fi
            echo "attempt $attempt/10: production served commit '${served:-<no marker>}', expected $EXPECTED_COMMIT"
            sleep 6
          done
          echo "::error::Production never served commit $EXPECTED_COMMIT after deploy"
          exit 1
